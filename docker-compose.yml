services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "43210:43210"
    environment:
      - NODE_ENV=production
      - PORT=43210
      - HOST=0.0.0.0
      - NEXT_PUBLIC_GATEWAY_URL=ws://127.0.0.1:18789
    depends_on:
      - hermes-gateway
    restart: unless-stopped

  hermes-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run demo-gateway
    ports:
      - "18789:18789"
    environment:
      # You can specify your actual hermes api url and key here if you have a real backend
      # - HERMES_API_URL=http://your-actual-backend:8642
      # - HERMES_API_KEY=your-api-key
      - HERMES_ADAPTER_PORT=18789
    restart: unless-stopped
